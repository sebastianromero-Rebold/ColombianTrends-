name: Recolectar señales

# 5:40 a. m. Colombia (10:40 UTC), antes de que corra el agente del radar (6:30 a. m.).
# Guarda data/raw/AAAA-MM-DD/signals.json: Google Trends, X, Mercado Libre, autocompletar y YouTube.
on:
  schedule:
    - cron: "40 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recolectar
        run: python scripts/collect_signals.py "$(TZ=America/Bogota date +%F)"

      - name: Guardar en main
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/raw
          git diff --cached --quiet && exit 0
          git commit -m "Señales $(TZ=America/Bogota date +%F)"
          git pull --rebase origin main
          git push origin main
